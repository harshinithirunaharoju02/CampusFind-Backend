services:
  - type: web
    name: campusfind-backend
    runtime: java
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/Campusfind-backend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/users
    envVars:
      - key: AIVEN_DB_PASSWORD
        sync: false          # Set manually in Render dashboard (never commit!)
      - key: FRONTEND_URL
        sync: false          # Set to your Vercel URL in Render dashboard
      - key: JAVA_OPTS
        value: "-Xmx400m -Xms200m"
      - key: SERVER_PORT
        value: "8080"
